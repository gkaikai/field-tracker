// Gradle 初始化脚本 — 为所有缺少 namespace 的 Android 库模块添加默认命名空间
// 放置在 android/init.gradle，在 workflow 中通过 -I 参数引用

allprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.library") || project.plugins.hasPlugin("com.android.application")) {
            if (project.android.hasProperty("namespace") && project.android.namespace == null) {
                // 从 project.group 或模块名推断命名空间
                def ns = project.group ?: "com.${project.name.replace('-', '.').replace('_', '.')}"
                project.android.namespace = ns
                println "✅ 设置 namespace: $ns  for ${project.name}"
            }
        }
    }
}

gradle.projectsLoaded {
    println "✅ Gradle init script loaded — namespace fix active"
}
