# 外勤定位APP — 自动发布工作流
# 用法: git tag v1.0.1 && git push origin v1.0.1
# 自动构建APK并发布到GitHub Releases

name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: 安装依赖
        run: flutter pub get
        working-directory: app

      - name: 修复插件AGP 8.x兼容性
        run: |
          python3 << 'PYEOF'
          import glob, os, re

          # 只修复高德地图SDK的build.gradle
          for f in glob.glob(
              os.path.expanduser("~") + "/.pub-cache/hosted/pub.dev/amap_flutter_*/android/build.gradle"
          ):
              with open(f) as fh:
                  content = fh.read()

              if "com.android.library" not in content:
                  continue
              if "namespace" in content:
                  continue

              # 提取group作为namespace
              m = re.search(r"group\s+'([^']+)'", content)
              ns = m.group(1).replace("-",".") if m else "com.amap.flutter"

              # 添加namespace和compileSdk
              content = content.replace(
                  "android {",
                  'android {\n    namespace "' + ns + '"\n    compileSdk 34'
              )
              content = re.sub(r'\n\s*compileSdkVersion\s+\d+', '', content)

              with open(f, "w") as fh:
                  fh.write(content)
              print(f"✅ 修复: {f}")

          print("✅ 兼容性修复完成")
          PYEOF

      - name: 构建 Release APK
        run: flutter build apk --release
        working-directory: app

      - name: 获取版本号
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: 读取更新日志
        id: changelog
        run: |
          git tag -l '${{ steps.version.outputs.tag }}' --format='%(contents:body)' > /tmp/changelog.txt

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: 外勤定位APP ${{ steps.version.outputs.tag }}
          body_path: /tmp/changelog.txt
          files: |
            app/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
