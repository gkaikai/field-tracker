# 外勤定位APP — 自动发布工作流

name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: 安装依赖
        run: flutter pub get
        working-directory: app

      - name: 构建 Release APK
        run: flutter build apk --release --dart-define=AMAP_ANDROID_KEY=0e00439a3a2b04282e78083ea7a9b19d --dart-define=AMAP_IOS_KEY= --dart-define=AMAP_WS_KEY=665f6c9959c69f9c08ae1d869d2b7abd
        working-directory: app

      - name: 获取版本号
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: 外勤定位APP ${{ steps.version.outputs.tag }}
          body: ${{ github.event.head_commit.message }}
          files: |
            app/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
