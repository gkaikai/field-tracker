# 外勤定位APP — 自动发布工作流
# 用法: git tag v1.0.0 && git push origin v1.0.0
# 自动构建APK并发布到GitHub Releases

name: Build & Release

on:
  push:
    tags:
      - 'v*'  # 匹配 v1.0.0, v2.1.3 等标签

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      - name: 安装依赖
        run: flutter pub get
        working-directory: app

      - name: 构建 Release APK
        run: flutter build apk --release
        working-directory: app

      - name: 构建 Release AAB (Google Play)
        run: flutter build appbundle --release
        working-directory: app
        continue-on-error: true  # AAB可选，失败不影响APK

      - name: 获取版本号
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: 外勤定位APP ${{ steps.version.outputs.tag }}
          body: |
            ## 外勤定位APP ${{ steps.version.outputs.tag }}

            ### 安装说明
            - **APK文件**: `app-release.apk` — 直接下载安装到手机
            - **AAB文件**: `app-release.aab` — Google Play上架用

            ### 更新内容
            (请在此处填写更新日志)
          files: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/bundle/release/app-release.aab
          draft: false
          prerelease: false
