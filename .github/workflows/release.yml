# 外勤定位APP — 自动发布工作流
# 用法: git tag v1.0.1 && git push origin v1.0.1
# 自动构建APK并发布到GitHub Releases

name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: 安装依赖
        run: flutter pub get
        working-directory: app

      - name: 修复插件AGP 8.x兼容性
        run: |
          # amap_flutter_location 缺少 namespace，AGP 8.7+ 要求显式声明
          for f in $(find ~/.pub-cache/hosted/pub.dev/amap_flutter_location-* -name "build.gradle" -path "*/android/build.gradle"); do
            if ! grep -q "namespace" "$f" 2>/dev/null; then
              sed -i 's/compileSdkVersion 29/namespace "com.amap.flutter.location"\n    compileSdk 34/' "$f"
              echo "✅ 已修复: $f"
            fi
          done
          for f in $(find ~/.pub-cache/hosted/pub.dev/amap_flutter_map-* -name "build.gradle" -path "*/android/build.gradle"); do
            if ! grep -q "namespace" "$f" 2>/dev/null; then
              sed -i 's/compileSdkVersion 29/namespace "com.amap.flutter.amap_flutter_map"\n    compileSdk 34/' "$f"
              echo "✅ 已修复: $f"
            fi
          done
          echo "✅ 插件兼容性修复完成"

      - name: 构建 Release APK
        run: flutter build apk --release
        working-directory: app

      - name: 获取版本号
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: 读取更新日志
        id: changelog
        run: |
          git tag -l '${{ steps.version.outputs.tag }}' --format='%(contents:body)' > /tmp/changelog.txt

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: 外勤定位APP ${{ steps.version.outputs.tag }}
          body_path: /tmp/changelog.txt
          files: |
            app/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
