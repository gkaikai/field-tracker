<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>外勤定位 - 管理后台</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; color: #333; }
#loginView { display: none; align-items: center; justify-content: center; min-height: 100vh; }
.login-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 360px; max-width: 90vw; }
.login-box h1 { text-align: center; margin-bottom: 24px; color: #1677ff; }
.login-box input { width: 100%; padding: 12px 16px; margin-bottom: 12px; border: 1px solid #d9d9d9; border-radius: 8px; font-size: 16px; }
.login-box button { width: 100%; padding: 12px; background: #1677ff; color: white; border: none; border-radius: 8px; font-size: 16px; }
#mainView { display: none; min-height: 100vh; }
.topbar { background: #1677ff; color: white; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; }
.topbar h2 { font-size: 16px; }
.topbar button { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 4px 10px; border-radius: 6px; }
.sidebar { background: white; border-right: 1px solid #e8e8e8; overflow-x: auto; white-space: nowrap; }
.sidebar button { display: inline-block; padding: 10px 14px; background: none; border: none; font-size: 14px; cursor: pointer; color: #333; border-bottom: 2px solid transparent; }
.sidebar button.active { background: #e6f4ff; color: #1677ff; font-weight: 600; border-bottom-color: #1677ff; }
.content { padding: 16px; min-height: calc(100vh - 90px); }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 12px; margin-bottom: 16px; }
.stat-card { background: white; padding: 16px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
.stat-card .stat-num { font-size: 26px; font-weight: 700; }
.stat-card.blue { border-left: 4px solid #1677ff; }
.stat-card.green { border-left: 4px solid #52c41a; }
.stat-card.orange { border-left: 4px solid #fa8c16; }
.stat-card.purple { border-left: 4px solid #722ed1; }
.data-table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow-x: auto; display: block; }
.data-table th { background: #fafafa; padding: 8px 10px; text-align: left; font-size: 12px; color: #666; white-space: nowrap; }
.data-table td { padding: 8px 10px; border-top: 1px solid #f0f0f0; font-size: 12px; }
.card { background: white; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
.form-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
.form-row input, .form-row select { padding: 6px 10px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 14px; }
.form-row label { min-width: 60px; font-size: 13px; }
button { padding: 6px 14px; background: #1677ff; color: white; border: none; border-radius: 6px; font-size: 13px; }
button.danger { background: #ff4d4f; }
button.success { background: #52c41a; }
button.active { background: #1677ff; box-shadow: 0 0 0 2px rgba(22,119,255,0.3); }
.speed-btn { background: #f0f0f0; color: #333; }
.speed-btn.active { background: #1677ff; color: white; box-shadow: 0 0 0 2px rgba(22,119,255,0.3); }
.fence-map { width: 100%; height: 350px; border-radius: 8px; margin: 8px 0; }
.tag { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin: 1px; }
.tag-green { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; }
.tag-red { background: #fff2f0; color: #ff4d4f; border: 1px solid #ffccc7; }
.tag-blue { background: #e6f4ff; color: #1677ff; border: 1px solid #91caff; }
.tab-content { display: none; }
#dashboard { display: block; }
.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.photo-grid img { width: 100%; height: 150px; object-fit: cover; border-radius: 6px; }
.amap-marker-label { border: none; background: rgba(255,255,255,0.9); padding: 4px 8px; border-radius: 4px; font-size: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.15); }
.map-layer-toggle { position: absolute; bottom: 80px; right: 10px; z-index: 999; background: white; border: 1px solid #d9d9d9; border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.15); user-select: none; }
.map-layer-toggle:hover { background: #f5f5f5; }
.map-layer-toggle:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
<script>
window._AMapSecurityConfig = { securityJsCode: 'f54f44a83e49995348e72713f2ca1b9a' };
</script>
<script src="https://webapi.amap.com/maps?v=2.0&key=7ac68442bb2d4a49a4aab6237ea29f48"></script>
</head>
<body>

<div id="loginView">
  <div class="login-box">
    <h1>🔐 外勤管理后台</h1>
    <input type="text" id="loginPhone" placeholder="手机号" value="13800138000" />
    <input type="password" id="loginPwd" placeholder="密码" value="test123456" />
    <button id="loginBtn">登录</button>
  </div>
</div>

<div id="mainView">
  <div class="topbar">
    <h2>📊 外勤定位 - 管理后台</h2>
    <div style="display:flex;align-items:center;gap:12px">
      <span id="adminVersion" style="font-size:11px;opacity:0.7"></span>
      <button onclick="['admin_token','admin_userId','admin_userPhone'].forEach(k=>localStorage.removeItem(k));location.reload()">退出</button>
    </div>
  </div>
  <div class="sidebar" id="sidebarNav">
    <button class="nav-btn active" onclick="showTab('dashboard')" data-tab="dashboard">📊 数据看板</button>
    <button class="nav-btn" onclick="showTab('monitor')" data-tab="monitor">🖥️ 实时监控 / 轨迹</button>
    <button class="nav-btn" onclick="showTab('rules')" data-tab="rules">⚙️ 打卡规则</button>
    <button class="nav-btn" onclick="showTab('org')" data-tab="org">🏢 组织架构</button>
    <button class="nav-btn" onclick="showTab('reports')" data-tab="reports">📈 统计报表</button>
    <button class="nav-btn" onclick="showTab('fences')" data-tab="fences">🚧 围栏管理</button>
    <button class="nav-btn" onclick="showTab('customers')" data-tab="customers">👥 客户管理</button>
    <button class="nav-btn" onclick="showTab('photos')" data-tab="photos">📸 水印照片</button>
    <button class="nav-btn" onclick="showTab('users')" data-tab="users">👤 人员管理</button>
  </div>
  <div class="content">
    <div id="dashboard" class="tab-content"><div id="dashContent"><p>加载中...</p></div></div>
    <div id="monitor" class="tab-content"><div id="monitorContent"></div></div>
    <div id="tracks" class="tab-content"><div id="trackContent"><p>加载中...</p></div></div>
    <div id="rules" class="tab-content"><div id="rulesContent"><p>加载中...</p></div></div>
    <div id="reports" class="tab-content"><div id="reportsContent"><p>加载中...</p></div></div>
    <div id="org" class="tab-content"><div id="orgContent"><p>加载中...</p></div></div>
    <div id="fences" class="tab-content"><div id="fencesContent"></div></div>
    <div id="customers" class="tab-content"><div id="customersContent"><p>加载中...</p></div></div>
    <div id="photos" class="tab-content"><div id="photosContent"><p>加载中...</p></div></div>
    <div id="users" class="tab-content"><div id="usersContent"><p>加载中...</p></div></div>
  </div>
</div>

<script src="/admin.js"></script>
</body>
</html>
