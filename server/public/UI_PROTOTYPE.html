.phone .nav .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10px;color:#94A3B8;cursor:pointer;position:relative}
.phone .nav .tab .ic{font-size:20px}
.phone .nav .tab.active{color:#2563EB}
